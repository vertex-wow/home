name: Sync site to Pages repo

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/sync-site.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout home
        uses: actions/checkout@v4
        with:
          path: home

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/site
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site-repo

      - name: Sync site/ into public/
        run: rsync -a home/site/ site-repo/public/

      - name: Commit and push
        working-directory: site-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync root site from home"
            git push
          fi
